[package]
name = "spotify-sort"
version = "0.1.0"
description = "Spotify Sort — harmonic mixing, as a Mac app"
edition = "2021"

[lib]
name = "spotify_sort_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-http = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
